# =============================================================================
# Seg-only Registration Configuration (FFD Upgrade)
# =============================================================================
# Configuration file for segmentation-only brain registration. Both inputs
# are 5-channel one-hot segmentation maps; the model warps template_seg
# toward sample_seg. 

# -----------------------------------------------------------------------------
# Data Paths
# -----------------------------------------------------------------------------
data:
  # Training and validation data lists
  train_txt: "/shared/home/v_mahith_reddy/RegNET/S-RegNET/train.txt"
  val_txt:   "/shared/home/v_mahith_reddy/RegNET/S-RegNET/val.txt"

  # Template subject seg
  template_seg_path: "/shared/scratch/0/home/v_mahith_reddy/oasis_complete/OASIS_OAS1_0406_MR1/seg4_onehot.npy"

  # File naming inside each subject directory.
  seg_filename: "seg4_onehot.npy"

  # SynthSeg one-hot (produced by convert_synthseg_one_hot.py)
  synthseg_filename: "synthseg_onehot_v1.npy"

  # Genus-0 WM template mesh (.npz: verts_norm, faces, n_lh)
  template_wm_mesh_path: "/shared/scratch/0/home/v_mahith_reddy/oasis_complete/OASIS_OAS1_0406_MR1/template_wm_mesh.npz"

# -----------------------------------------------------------------------------
# Experiment routing
# -----------------------------------------------------------------------------
experiment:
  input_source: gt            # synthseg | gt
  supervision_target: gt      # gt | synthseg

# -----------------------------------------------------------------------------
# Output Configuration
# -----------------------------------------------------------------------------
output:
  base_dir: "/shared/scratch/0/home/v_mahith_reddy/regnet_training_exp6"
  checkpoint_subdir: "checkpoints"
  log_subdir: "logs"
  viz_subdir: "viz_output"

# -----------------------------------------------------------------------------
# Model Architecture
# -----------------------------------------------------------------------------
model:
  target_size: [128, 128, 128]
  num_classes: 5
  seg_channels: 5

# -----------------------------------------------------------------------------
# Transform — bounded forward cubic-B-spline FFD
# -----------------------------------------------------------------------------
transform:
  cp_spacing: 4
  n_stages: 3
  injectivity_k: 0.40

# -----------------------------------------------------------------------------
# Affine Pre-alignment
# -----------------------------------------------------------------------------
affine:
  enabled: true
  regularization_weight: 0.01
  orthogonality_weight: 0.0

# -----------------------------------------------------------------------------
# Training Hyperparameters
# -----------------------------------------------------------------------------
training:
  batch_size: 1
  num_epochs: 200
  num_workers: 0
  pin_memory: true

  learning_rate: 1.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 1.0e-5

  warmup_epochs: 15

  use_amp: true

  save_every: 10
  patience: 50
  max_grad_norm: 1.0

# -----------------------------------------------------------------------------
# Loss Function Weights
# -----------------------------------------------------------------------------
loss:
  dice:          1.0
  cross_entropy: 0.2
  bending:       0.01
  affine_reg:    0.01

  # White Matter is heavily prioritized (weight 5.0) for maximum Dice score
  class_weights: [0.1, 0.1, 0.1, 5.0, 0.1]

# -----------------------------------------------------------------------------
# Reproducibility
# -----------------------------------------------------------------------------
seed: 42

# -----------------------------------------------------------------------------
# Device Configuration
# -----------------------------------------------------------------------------
device:
  gpu: "cuda:0"
  cudnn_benchmark: true

# -----------------------------------------------------------------------------
# Visualization Settings
# -----------------------------------------------------------------------------
visualization:
  num_samples: 30
  detailed_samples: 10
  seed: 42
  class_names:
    - "Background"
    - "Cortex"
    - "Subcortical GM"
    - "White Matter"
    - "CSF"

# -----------------------------------------------------------------------------
# Resume Training
# -----------------------------------------------------------------------------
resume:
  checkpoint_path: null
